<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Alicia Martín</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500&amp;family=EB+Garamond:ital,wght@0,400;0,500;1,400&amp;family=Source+Serif+4:opsz,wght@8..60,400;8..60,500&amp;family=Courier+Prime&amp;display=swap" rel="stylesheet">
<style>*,*::before,*::after{box-sizing:border-box}
:root{--ink:#141414;--muted:#5f5f5b;--red:#c8322b;--bg:#fcfcfb;--pad:clamp(20px,4vw,56px);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
body{margin:0;background:transparent;color:var(--ink);font-family:"Inter Tight","Helvetica Neue",Arial,sans-serif;font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none}a:hover{color:var(--red)}
.ul{text-decoration:underline;text-decoration-color:var(--red);text-underline-offset:4px;text-decoration-thickness:1px}
.red{color:var(--red)}
.wrap{max-width:1200px;margin:0 auto;padding-left:var(--pad);padding-right:var(--pad)}
.mono{font-family:"Courier Prime","Courier New",monospace;font-size:12px;letter-spacing:.02em}
.muted{color:var(--muted)}
/* background */
.bg{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
.stars{position:absolute;inset:0;width:100%;height:100%}
.tw{animation:tw 6s ease-in-out infinite}@keyframes tw{0%,100%{opacity:1}50%{opacity:.15}}
.galaxy{display:none;position:absolute;width:clamp(520px,62vw,900px);aspect-ratio:1;opacity:.32;transform:translate(-50%,-50%) rotate(-18deg)}
.galaxy-svg{width:100%;height:100%;display:block}
.page-home .galaxy{display:block;left:14%;top:82%}
.page-contact .galaxy{display:block;left:80%;top:42%}
.page-home .bg,.page-contact .bg{background:radial-gradient(circle at var(--gx) var(--gy),rgba(29,31,28,.07),rgba(29,31,28,.025) 35%,transparent 70%)}
.page-home{--gx:14%;--gy:82%}.page-contact{--gx:80%;--gy:42%}
/* header */
.site-header{display:flex;align-items:center;justify-content:space-between;gap:24px;flex-wrap:wrap;padding-top:22px;padding-bottom:22px}
.site-header nav{display:flex;gap:clamp(16px,2.4vw,30px);flex-wrap:wrap}
.site-header nav a{display:flex;align-items:center;min-height:44px;font-size:15px}
.site-header nav a[aria-current=page]{text-decoration:underline;text-decoration-color:var(--red);text-decoration-thickness:2px;text-underline-offset:6px}
.brand{display:flex;flex-direction:column;line-height:1.1}
.brand-name{font-family:"EB Garamond",Garamond,Georgia,serif;font-size:clamp(26px,2.6vw,34px)}
.brand-sub{font-family:"Courier Prime","Courier New",monospace;font-size:11.5px;color:var(--muted);margin-top:4px}
.pill{display:inline-flex;align-items:center;min-height:42px;padding:0 18px;border:1px solid var(--ink);border-radius:999px;font-size:14px;background:rgba(252,252,251,.8)}

/* home */
.hero{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,.7fr);gap:clamp(32px,6vw,96px);align-items:start;align-content:start;row-gap:32px;padding-top:clamp(16px,5vh,56px);padding-bottom:48px}
.hero-name{margin:0;font-size:clamp(22px,2.1vw,27px);font-weight:400;letter-spacing:-.025em;line-height:1.02}
.hero-sub{margin:6px 0 0;color:var(--muted);font-weight:500;font-size:14px}
.hero-text p{margin:0 0 12px;max-width:600px}.hero-links{margin-top:22px!important;color:var(--muted)}.hero-name::after{content:"";display:block;width:40px;height:2px;background:var(--red);margin-top:14px}.hero-head{grid-column:1/-1}
.hero-photo{width:100%;max-width:210px;aspect-ratio:13/14;object-fit:cover;object-position:50% 40%;border-radius:6px;justify-self:center}
/* serif pages */
.serif{font-family:"Source Serif 4",Georgia,serif;font-size:15px}
.serif h1{font-family:"EB Garamond",Garamond,Georgia,serif;font-weight:400;font-size:clamp(26px,2.4vw,32px);line-height:1.05;margin:0 0 16px}
.intro{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:clamp(24px,5vw,64px);align-items:center;padding:24px 0 40px}
.lead{margin:0;font-size:14.5px;max-width:720px;text-align:justify;hyphens:auto}
.tree-fig{margin:0;max-width:220px;display:flex;flex-direction:column;gap:10px}
.tree-fig .tf{font-size:14px;white-space:nowrap}
.tree-fig figcaption{color:var(--muted)}
.project{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:clamp(24px,5vw,64px);padding:36px 0;border-top:1px solid rgba(20,20,20,.15)}
.project-head .num{font-family:"Courier Prime",monospace;font-size:13px;color:var(--red)}
.project h2{font-family:"EB Garamond",Garamond,Georgia,serif;font-weight:400;font-size:clamp(20px,1.8vw,24px);line-height:1.1;margin:6px 0 12px}
.links{display:flex;flex-direction:column;gap:6px;font-family:"Courier Prime",monospace;font-size:12.5px}
.project-body p{margin:0 0 14px;max-width:720px;text-align:justify;hyphens:auto}
.pubs{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:clamp(28px,5vw,72px);align-items:start;padding-top:24px;padding-bottom:48px}
.flower-fig{margin:0;position:sticky;top:24px}
.flower-fig figcaption{font-size:15px;overflow-x:auto}
.small-h{font-family:"Courier Prime",monospace;font-weight:400;font-size:13px;color:var(--muted);margin:28px 0 6px}
.publist{list-style:none;margin:0;padding:0}
.publist li{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:16px;padding:12px 0}
.yr{font-family:"Courier Prime",monospace;font-size:12.5px;color:var(--red);padding-top:5px}
.pt{font-family:"EB Garamond",Garamond,Georgia,serif;font-size:18px;line-height:1.2}
.pa{font-family:"Courier Prime",monospace;font-size:12px;color:var(--muted);margin-top:4px;line-height:1.5}
.pj{color:var(--ink)}
.pl{display:flex;flex-direction:column;gap:4px;font-family:"Courier Prime",monospace;font-size:12px;text-align:right}
.cv{display:flex;flex-direction:column;align-items:center;gap:28px;padding-bottom:56px}
.cv-bar{width:100%;max-width:760px}
.cv img{width:100%;max-width:760px;box-shadow:0 2px 6px rgba(0,0,0,.08),0 18px 40px rgba(0,0,0,.12);background:#fff}
.contact{display:flex;align-items:flex-start;padding-top:clamp(24px,9vh,90px);padding-bottom:64px}
.note{max-width:560px;display:flex;flex-direction:column;gap:20px}
.letter{font-family:"EB Garamond",Garamond,Georgia,serif;font-size:clamp(18px,1.6vw,19px);line-height:1.5;margin:0}
.email{font-family:"EB Garamond",Garamond,Georgia,serif;font-size:clamp(18px,1.8vw,21px);align-self:flex-start}
@media (max-width:820px){
 .hero,.intro,.project,.pubs{grid-template-columns:1fr}
 .hero{min-height:auto}
 .hero-photo{justify-self:start;max-width:220px}
 .flower-fig{position:static;max-width:260px}
 .publist li{grid-template-columns:44px minmax(0,1fr)}
 .pl{grid-column:2;flex-direction:row;gap:14px;text-align:left}
 .page-contact .galaxy{left:70%;top:80%}
}
@media (prefers-reduced-motion:reduce){.tw{animation:none}}

/* expression tree: static, no animation */
.tree-fig [class^=tn],.tree-fig .tf{animation:none!important;opacity:1!important}

.nw{white-space:nowrap}
.site-footer{padding-top:28px;padding-bottom:28px;color:var(--muted);border-top:1px solid rgba(20,20,20,.12);margin-top:24px}
.hero-text,.project-body,.note,.pubs>div{min-width:0;overflow-wrap:break-word}
@media (max-width:820px){
 .site-header{gap:12px}
 .site-header nav{order:3;width:100%;gap:18px}
 .brand-sub{display:none}
 .pill{min-height:38px;padding:0 14px;font-size:13px}
 .hero{padding-top:8px}
 .hero-name{font-size:26px}
 .email{word-break:break-all}
}

<div class="hero-head">
<h1 class="hero-name">Interpretable machine learning for cosmology</h1>
</div>
<div class="hero-text">
<p>I'm a DPhil student in astrophysics at the University of Oxford, supervised by Pedro Ferreira, Harry Desmond and Deaglan Bartlett. I work on machine learning for cosmological inference, using symbolic regression to find the <span class="red">simplest analytic expression</span> the data supports.</p>
<p>My main projects derive dark-matter halo profiles from weak lensing and galaxy rotation curves, and find closed-form mark functions for marked power spectra. I'm also drawn to more theoretical questions, such as the cosmic dipole problem.</p>
<p>I'm always happy to collaborate, so feel free to <a class="ul" href="#contact">get in touch</a>.</p>

<div><h1>Research</h1><p class="lead">I work on machine learning for cosmological inference, mainly developing and applying symbolic regression to build interpretable models of physical systems. My main projects derive dark-matter halo profiles from weak lensing and rotation-curve data, and find closed-form expressions for marked power spectra. I'm also interested in more theoretical questions, such as the cosmological dipole problem.</p></div>
</section>
<article id="esr" class="project"><div class="project-head"><span class="num">01</span><h2>Exhaustive Symbolic Regression</h2><div class="links"><a class="ul" href="https://arxiv.org/abs/2211.11461">ESR paper · arXiv ↗</a><a class="ul" href="https://github.com/DeaglanBartlett/ESR">ESR code · GitHub ↗</a></div></div><div class="project-body"><p>Symbolic regression looks for the equation that describes a dataset, rather than the parameters of an equation chosen in advance. Most codes search the space of equations stochastically, usually with genetic programming, so they are not guaranteed to find the best function. Exhaustive Symbolic Regression, developed at Oxford by Deaglan Bartlett, Harry Desmond and Pedro Ferreira, instead considers every possible equation built from a set of operators up to a given complexity, fits the parameters of each one, and ranks them all using the minimum description length principle, which combines accuracy and simplicity into a single objective.</p><p>The result is not just one best fit but a complete ranking, showing which functional forms the data genuinely supports and which features are simply not constrained. ESR is the method at the heart of most of my work; when the search space is too large to enumerate, I use genetic-programming codes such as OPERON. Every equation in the search is an expression tree, like the one above.</p></div></article><article id="halo" class="project"><div class="project-head"><span class="num">02</span><h2>Dark-matter halo profiles</h2><div class="links"><a class="ul" href="https://arxiv.org/abs/2601.05203">MNRAS 2026 · arXiv ↗</a><a class="ul" href="https://arxiv.org/abs/2511.23073">Phil. Trans. R. Soc. A 2026 · arXiv ↗</a><a class="ul" href="https://github.com/Alicia-Martin/ESR_weak">Code · ESR_weak ↗</a><a class="ul" href="https://github.com/Alicia-Martin/MIGHTEE_ESR">Code · MIGHTEE_ESR ↗</a></div></div><div class="project-body"><p>Dark-matter haloes are usually described by density profiles with a fixed form, such as NFW, motivated by simulations. But those predictions depend on uncertain dark-matter physics and baryonic modelling. I use ESR to constrain halo profiles directly from observations instead, without assuming a shape.</p><p>On mock weak-lensing data, ESR recovers NFW from as few as ~20 clusters when errors are around 5%; at the precision of current surveys simpler functions are favoured, because lensing errors are smallest in the outskirts. Applied to 149 HSC-XXL clusters, it finds profiles that statistically outperform NFW: over 0.3–3 h<sup>−1</sup> Mpc the top-ranked ones are shallow in the centre with a maximum in density, and they can be used to estimate enclosed masses. I'm now extending the method to CLASH cluster lensing and to galaxy rotation curves from MIGHTEE and SPARC.</p></div></article><article id="marks" class="project"><div class="project-head"><span class="num">03</span><h2>Optimal marked power spectra</h2><div class="links"><a class="ul" href="https://github.com/Alicia-Martin/marked_pk">Code · marked_pk ↗</a></div></div><div class="project-body"><p>The ordinary power spectrum misses the non-Gaussian information in the matter field. Marked power spectra re-weight the field with a “mark” to recover some of it, but which mark is best? I optimise mark functions flexibly with splines, then use OPERON to distil the optimum into a compact closed-form expression.</p><p>I'm currently applying this to 2D weak-lensing convergence maps, rather than 3D density fields, to tighten constraints on S<sub>8</sub> and Ω<sub>m</sub>, with the aim of using real HSC data. Paper in preparation.</p></div></article><article id="dipole" class="project"><div class="project-head"><span class="num">04</span><h2>The cosmic dipole</h2><div class="links"><a class="ul" href="https://arxiv.org/abs/2512.03867">Phys. Rev. D 114, 023526 · arXiv ↗</a></div></div><div class="project-body"><p>If the CMB dipole is due only to our motion, the dipole in quasar and radio-source counts should match it. Observations suggest it is larger, hinting that matter and radiation may not share a rest frame.</p><p>We study tilted anisotropic universes, in which matter and radiation can move relative to each other, and consider spatial curvature, cosmic heat flux, large-scale electromagnetic fields and a Khronon field as possible sources of the tilt.</p></div></article>
